# Checks every pull request and every push to main: secrets, dependencies,
# types, unit tests and a production build. Lint isn't a gate yet because main
# still has 33 existing problems (README, known issues); it runs and reports
# without failing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads every commit, not only the latest.
          fetch-depth: 0

      # Fails if any commit holds something that looks like a key or token.
      # Checked false positives are listed in .gitleaksignore.
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lists every known vulnerability in the packages the app ships, and
      # fails on critical ones. The high ones today sit inside the wallet
      # libraries and need the wagmi 3 upgrade (README, known issue 14).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      - name: Lint (reported, not yet required)
        run: npx eslint .
        continue-on-error: true

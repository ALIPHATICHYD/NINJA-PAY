# Checks every pull request and every push to main: types, unit tests and a
# production build. Lint isn't a gate yet because main still has 33 existing
# problems (README, known issues); it runs and reports without failing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      - name: Lint (reported, not yet required)
        run: npx eslint .
        continue-on-error: true
